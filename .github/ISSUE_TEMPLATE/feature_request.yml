name: Feature request
description: An idea for something Limit Rings should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem behind the idea – this helps more than a finished solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional – a sketch of the solution you have in mind.
