name: Tests

on:
  push:
    branches: [main, dev]   # other branches are tested through their pull request
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces the older run; on main and dev every commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]   # the oldest supported version and the newest release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: gettext, for the comparison with GNU msgfmt
        run: sudo apt-get update && sudo apt-get install -y gettext
      - run: python -m pip install pytest
      - run: python -m pytest -q
        working-directory: collector
      - name: Run the collector from the built package
        run: |
          python tools/build_plasmoid.py --source store --dir "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" LIMIT_RINGS_NOTIFY=0 python "$RUNNER_TEMP/pkg/contents/collector/run.py" > "$RUNNER_TEMP/out.json"
          python - "$RUNNER_TEMP" <<'EOF'
          import json, sys
          tmp = sys.argv[1]
          out = json.load(open(f"{tmp}/out.json"))
          assert out.get("envelope") == 1 and "stats" in out, out
          meta = json.load(open(f"{tmp}/pkg/metadata.json"))["KPlugin"]["Version"]
          built = open(f"{tmp}/pkg/contents/collector/limit_rings/version.py").read()
          assert f'VERSION = "{meta}"' in built, built
          print(f"package {meta}: collector ran")
          EOF

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install ruff
      - run: ruff check collector tools

  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Qt and the Plasma QML modules
        run: pacman -Syu --noconfirm --needed git qt6-declarative kirigami libplasma plasma5support ksvg
      - uses: actions/checkout@v7
      - run: /usr/lib/qt6/bin/qmltestrunner -input plasmoid/tests
        env:
          QT_QPA_PLATFORM: offscreen
