name: Tests

on:
  push:
    branches: [main, dev]   # other branches are tested through their pull request
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces the older run; on main and dev every commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]   # the oldest supported version and the newest release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: gettext, for the comparison with GNU msgfmt
        # A stalled package mirror used to hang this step until the whole job timed out: short network
        # timeouts with retries make apt fail over quickly, and the step has its own limit.
        timeout-minutes: 4
        run: |
          command -v msgfmt && exit 0
          apt_opts="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3"
          sudo apt-get $apt_opts install -y --no-install-recommends gettext \
            || { sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends gettext; }
      - run: python -m pip install pytest
      - run: python -m pytest -q
        working-directory: collector
      - name: Run the collector from the built package
        run: |
          python tools/build_plasmoid.py --source store --dir "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" LIMIT_RINGS_NOTIFY=0 python "$RUNNER_TEMP/pkg/contents/collector/run.py" > "$RUNNER_TEMP/out.json"
          python tools/check_package.py "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/out.json"

  collector-macos:
    # The collector on macOS (Claude login from the keychain); install.sh and the gettext comparison are skipped.
    name: collector (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install pytest
      - run: python -m pytest -q
        working-directory: collector
      - name: Run the collector from the built package
        # The empty HOME has no credentials file, so this pass looks for the login in the keychain.
        run: |
          python tools/build_plasmoid.py --source store --dir "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" LIMIT_RINGS_NOTIFY=0 python "$RUNNER_TEMP/pkg/contents/collector/run.py" > "$RUNNER_TEMP/out.json"
          python tools/check_package.py "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/out.json"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install ruff
      - run: ruff check collector tools

  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Qt and the Plasma QML modules
        run: pacman -Syu --noconfirm --needed git qt6-declarative kirigami libplasma plasma5support ksvg
      - uses: actions/checkout@v7
      - run: /usr/lib/qt6/bin/qmltestrunner -input plasmoid/tests
        env:
          QT_QPA_PLATFORM: offscreen
